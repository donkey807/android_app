name: Build Debug APK

# 触发：推到 main/master 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub ubuntu runner 已预装 Android SDK，只需装所需 platform/build-tools 并接受 license
      # （不再用 android-actions/setup-android@v3，它在新版 sdkmanager 上会去装已废弃的 "tools" 包而失败）
      - name: 配置 Android SDK
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      # 用 gradle-build-action 自动拉取 Gradle 8.4 并构建（无需本地 gradlew 包装）
      - name: 构建 Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          arguments: :app:assembleDebug

      # 把生成的 APK 作为可下载产物上传
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: digit-classifier-debug
          path: app/build/outputs/apk/debug/*.apk
